[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyarb"
version = "0.1.0"
description = "Binary-complement arbitrage bot for Polymarket CLOB V2"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Live trading only. Paper/replay/record work without these.
live = [
    "py-clob-client-v2>=1.1.0",
    "web3>=6.20",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
polyarb = "polyarb.cli:app"

[tool.setuptools.packages.find]
include = ["polyarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
