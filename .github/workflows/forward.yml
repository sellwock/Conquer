name: Forward log

# Saves each game's prediction before tip-off and grades it afterwards, into the `data` branch.
# Runs twice an hour; minutes 7 and 37 avoid the top-of-hour scheduling backlog.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: Dry run (log what would change, commit nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forward-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/espn
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - name: Snapshot, grade and record results
        run: npx tsx scripts/forward.ts --data data/v1 --cache .cache/espn ${{ inputs.dry && '--dry' || '' }}
      - name: Commit to the data branch
        if: ${{ !inputs.dry }}
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Log $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin data && git push -q origin HEAD:data; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
