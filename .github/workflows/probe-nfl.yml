name: Probe NFL feeds (temporary)
on:
  push:
    branches: [claude/probe-nfl]
    paths-ignore: ['data/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Which NFL prop types carry prices
        run: node scripts/probe/nfl-odds.mjs
      - name: Keep the responses on this branch
        if: always()
        run: |
          [ -d data/probe-nfl ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe-nfl
          git commit -q -m "NFL probe responses $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q origin HEAD:claude/probe-nfl
