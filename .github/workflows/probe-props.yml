name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: bt-cache
          key: bt-espn-nba-players-${{ github.run_id }}
          restore-keys: bt-espn-nba-
      - name: Fit player priors and variation against box scores
        run: npx tsx scripts/players.ts --league nba --ranges 20261020-20261101,20260105-20260331 --max 120 --sims 1000 --cache bt-cache --out players.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: players
          path: players.md
