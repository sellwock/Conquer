name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
    paths-ignore: ['data/**']
permissions:
  contents: write
jobs:
  props-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: bt-cache
          key: bt-espn-nba-props-${{ github.run_id }}
          restore-keys: bt-espn-nba-
      - name: The season's prop lines, as the model is, and anchored to the book's spread and total
        run: |
          R="--league nba --ranges 20260101-20260131,20261021-20261110 --max 1500 --sims 1000 --cache bt-cache"
          npx tsx scripts/props-backtest.ts $R --out props-plain.md
          npx tsx scripts/props-backtest.ts $R --anchor 0 --out props-anchor-make.md
          npx tsx scripts/props-backtest.ts $R --anchor 0.5 --out props-anchor-mix.md
          cat props-plain.md props-anchor-make.md props-anchor-mix.md > props.md
      - name: Keep the reports on this branch
        if: always()
        run: |
          mkdir -p data
          cp props-*.md data/ 2>/dev/null || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Anchoring replay reports" || exit 0
          git push -q origin HEAD:claude/probe-props
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: props-backtest
          path: props.md
