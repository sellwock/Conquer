name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Game-line fields on the core odds items
        run: |
          set +e
          date -u
          B=https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba
          for EV in 401909897 401909898; do
            echo "===== event $EV"
            curl -s "$B/events/$EV/competitions/$EV/odds?lang=en&region=us" > odds.json
            jq -c '.items[]? | {provider: .provider.name, details, spread, overUnder, overOdds, underOdds,
              home: (.homeTeamOdds | {moneyLine, spreadOdds, favorite, team: (.team["$ref"] // .team.abbreviation // null), keys: keys}),
              away: (.awayTeamOdds | {moneyLine, spreadOdds, favorite, keys: keys}),
              currentKeys: (.current | keys?), current: .current}' odds.json | head -c 4000; echo
          done
