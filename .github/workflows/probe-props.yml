name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: knobs
            tries: "usagePriorMin=120,ratePriorMin=180,minutesNoise=0,usageLevel=1;usagePriorMin=15,ratePriorMin=180,minutesNoise=0,usageLevel=1;usagePriorMin=120,ratePriorMin=20,minutesNoise=0,usageLevel=1;usagePriorMin=120,ratePriorMin=180,minutesNoise=1.5,usageLevel=1"
          - part: branch
            tries: "usagePriorMin=120,ratePriorMin=180,minutesNoise=0,usageLevel=1;usagePriorMin=15,ratePriorMin=20,minutesNoise=0,usageLevel=1;usagePriorMin=15,ratePriorMin=20,minutesNoise=1.5,usageLevel=1;usagePriorMin=15,ratePriorMin=20,minutesNoise=1.5,usageLevel=0.97"
          - part: fixes
            tries: "usagePriorMin=120,ratePriorMin=180,minutesNoise=0,usageLevel=1;usagePriorMin=15,ratePriorMin=180,minutesNoise=0,usageLevel=0.97;usagePriorMin=15,ratePriorMin=45,minutesNoise=1.5,usageLevel=0.97;usagePriorMin=15,ratePriorMin=20,minutesNoise=1,usageLevel=0.97"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: bt-cache
          key: bt-espn-nba-diag-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: bt-espn-nba-
      - name: Game and player lines, each knob on its own
        run: npx tsx scripts/players.ts --league nba --ranges 20260105-20260331 --max 600 --sims 1000 --cache bt-cache --out players.md --try "${{ matrix.tries }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.part }}
          path: players.md
