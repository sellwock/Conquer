name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: nba-split
            league: nba
            range: 20260105-20260331
            tries: "usagePriorMin=120,ratePriorMin=180,minutesNoise=0,creationPriorMin=120;usagePriorMin=15,ratePriorMin=20,minutesNoise=1.5,creationPriorMin=120;usagePriorMin=15,ratePriorMin=180,minutesNoise=0,creationPriorMin=120"
          - part: nba-alternatives
            league: nba
            range: 20260105-20260331
            tries: "usagePriorMin=120,ratePriorMin=180,minutesNoise=0,creationPriorMin=120;usagePriorMin=15,ratePriorMin=45,minutesNoise=1.5,creationPriorMin=120;usagePriorMin=120,ratePriorMin=20,minutesNoise=1.5,creationPriorMin=120"
          - part: college
            league: ncaam
            range: 20260110-20260301
            tries: "usagePriorMin=120,ratePriorMin=180,minutesNoise=0,creationPriorMin=120;usagePriorMin=15,ratePriorMin=20,minutesNoise=0,creationPriorMin=120;usagePriorMin=15,ratePriorMin=20,minutesNoise=0,creationPriorMin=15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: bt-cache
          key: bt-espn-${{ matrix.league }}-diag2-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: bt-espn-${{ matrix.league }}-
      - name: Game and player lines with lineup creation split from usage
        run: npx tsx scripts/players.ts --league ${{ matrix.league }} --ranges ${{ matrix.range }} --max 600 --sims 1000 --cache bt-cache --out players.md --try "${{ matrix.tries }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag2-${{ matrix.part }}
          path: players.md
