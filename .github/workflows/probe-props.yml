name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Live game lines vs the pre-game book, every 10 minutes
        run: |
          set +e
          B=https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba
          S=https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary
          for i in 1 2 3 4 5 6; do
            echo "########## $(date -u +%H:%M:%SZ)"
            for EV in 401909905 401909906; do
              curl -s "$S?event=$EV" | jq -c '.header.competitions[0] | {event: .id, state: .status.type.state, period: .status.period, clock: .status.displayClock,
                score: ([.competitors[] | "\(.team.abbreviation) \(.score // "-")"] | join(" "))}'
              curl -s "$B/events/$EV/competitions/$EV/odds?lang=en&region=us" | jq -c '.items[]? | {provider: .provider.name, details, spread, overUnder, overOdds, underOdds,
                homeML: .homeTeamOdds.moneyLine, homeSpreadOdds: .homeTeamOdds.spreadOdds, awayML: .awayTeamOdds.moneyLine, awaySpreadOdds: .awayTeamOdds.spreadOdds}'
            done
            [ $i -lt 6 ] && sleep 600
          done
