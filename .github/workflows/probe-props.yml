name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN prop bets, all pages
        run: |
          set +e
          B=https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba
          EV=401909892
          for PG in 1 2; do curl -s "$B/events/$EV/competitions/$EV/odds/100/propBets?lang=en&region=us&limit=1000&page=$PG" > p$PG.json; done
          jq -s '[.[].items[]]' p1.json p2.json > all.json
          echo "total items: $(jq length all.json)"
          echo "== all types"; jq -r 'group_by(.type.id) | map("\(.[0].type.id) \(.[0].type.name) x\(length)") | .[]' all.json
          A=$(jq -r '.[0].athlete["$ref"]' all.json | sed -E 's#.*/athletes/([0-9]+).*#\1#')
          echo "== every item for athlete $A, in feed order: type | target | american | open american | lastUpdated"
          jq -r --arg a "/athletes/$A?" '.[] | select(.athlete["$ref"] | contains($a)) | "\(.type.name) | \(.current.target.value) | \(.odds.american.value) | \(.odds.american.open) | \(.odds.total.value // "-")"' all.json
          echo "== first 30 Total-type pairs (type | athlete | target | american) in feed order"
          jq -r '.[] | select(.type.name | test("^Total (Points|Rebounds|Assists|3-Point)")) | "\(.type.name) | \(.athlete["$ref"] | capture("athletes/(?<id>[0-9]+)").id) | \(.current.target.value) | \(.odds.american.value)"' all.json | head -60
          echo "== any item with extra keys beyond the usual"
          jq -c '[.[] | keys] | unique' all.json
          echo "== full raw of items 0..3 of type id 1"
          jq -c '[.[] | select(.type.id=="1")][0:4]' all.json | head -c 4000; echo
          echo "== athlete ref sample"
          curl -s "$(jq -r '.[0].athlete["$ref"]' all.json | sed 's#^http:#https:#')" | jq -c '{id, displayName, shortName, team: .team["$ref"]}'
