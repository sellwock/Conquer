name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
jobs:
  injuries:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN league-wide injuries feed
        run: |
          set +e
          curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries" -o inj.json -w "status %{http_code}, %{size_download} bytes\n"
          echo "--- top-level keys"; jq -c 'keys' inj.json
          echo "--- teams"; jq -c '.injuries | length' inj.json
          echo "--- first team (without its injuries)"; jq -c '.injuries[0] | del(.injuries)' inj.json | head -c 1500; echo
          echo "--- first injury, full"; jq -c '.injuries[0].injuries[0]' inj.json | head -c 4000; echo
          echo "--- every injury: team, athlete id/name, status, type, date"
          jq -c '.injuries[] | .displayName as $t | .id as $tid | .injuries[] | {t: $t, tid: $tid, aid: (.athlete.id // (.athlete.links[0].href // "" | capture("id/(?<id>[0-9]+)").id // null)), name: .athlete.displayName, team: (.athlete.team.id // null), status, type: .type.description, date}' inj.json | head -60
          echo "--- statuses"; jq -r '[.injuries[].injuries[].status] | group_by(.) | map("\(.[0]): \(length)") | .[]' inj.json
          echo "--- a game summary's injuries (today's first game) for comparison"
          EV=$(curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" | jq -r '.events[0].id')
          echo "event $EV"
          curl -s "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=$EV" | jq -c '.injuries[]? | {team: .team.abbreviation, n: (.injuries | length), first: (.injuries[0] | {status, date, aid: .athlete.id, type: .type.description})}'
