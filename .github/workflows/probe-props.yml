name: Probe prop lines (temporary)
on:
  push:
    branches: [claude/probe-props]
    paths-ignore: ['data/**']
permissions:
  contents: write
jobs:
  props-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: bt-cache
          key: bt-espn-nba-props-${{ github.run_id }}
          restore-keys: bt-espn-nba-
      - name: A season of kept prop lines, fitted and tested
        run: npx tsx scripts/props-backtest.ts --league nba --ranges 20251115-20260412,20261021-20261109 --max 1500 --sims 1000 --cache bt-cache --out props.md --json entries.json
      - name: Keep the rows on this branch for a closer look
        if: always()
        run: |
          [ -f entries.json ] || exit 0
          mkdir -p data
          gzip -9 -c entries.json > data/props-history-nba.json.gz
          cp props.md data/props-history-nba.md
          ls -la data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Props backtest rows" || exit 0
          git push -q origin HEAD:claude/probe-props
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: props-backtest
          path: props.md
