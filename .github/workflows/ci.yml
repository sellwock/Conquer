name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately NOT the [live] extra. py-clob-client-v2 and web3 are optional,
      # and every import of them is lazy (ClobGateway.connect, Web3Settler.__init__,
      # the `live` CLI command). Installing without them means CI fails loudly if one
      # is ever hoisted to module scope — which would otherwise break paper mode and
      # the entire test suite for anyone who has not installed the live extra.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: python -m pyflakes polyarb tests

      - name: Tests
        run: python -m pytest -q

      # sample-frames.jsonl is committed but generated. Editing the generator without
      # regenerating would leave the end-to-end tests asserting against a stale
      # scenario, which passes while testing the wrong thing. The generator is
      # deterministic, so regeneration must be byte-identical.
      - name: Fixture is in sync with its generator
        run: |
          python tests/fixtures/make_fixture.py
          git diff --exit-code tests/fixtures/

      # Proves the installed console script and the full replay path work end to end,
      # with no network access of any kind.
      - name: Offline replay smoke test
        run: polyarb replay tests/fixtures/sample-frames.jsonl --capital 500
